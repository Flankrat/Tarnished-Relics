modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/Flankrat/Tarnished-Relics/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Flankrat/Tarnished-Relics"
authors="${mod_authors}"
description='''
Diablo-style loot: unidentified weapons, armor and tools turn up in loot chests. Take one to the right blacksmith villager to
find out what it is: a Magic, Rare or Unique relic with random affixes and a generated name, or a Legendary with its own
name, lore and signature enchantments. Modded gear is picked up automatically, and everything is datapack-driven, with
an in-game editor.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
